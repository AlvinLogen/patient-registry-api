name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iris-tests:
    name: iris-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create local configuration and throw-away secrets
        run: |
          cp .env.example .env
          mkdir -p secrets test-results
          openssl rand -base64 24 | tr -d '+/=\n' > secrets/iris_admin_password.txt
          openssl rand -base64 24 | tr -d '+/=\n' > secrets/iris_app_password.txt
          chmod 644 secrets/*.txt

      - name: Start IRIS (same Compose file as development)
        run: docker compose -up -d --wait

      - name: Create the clean PATREG namespace
        run: |
          docker compose exec -T iris sh -c "iris session IRIS -U USER < /home/irisowner/dev/docker/iris/ create-namespace.script" | 
          tee test-results/create-namspace.log
          if grep -q "ERROR #" test-results/create-namespace.log; then exit 1; fi

      - name: Import and compile the UDL
        run: |
          docker compose exec -T iris sh -c "iris session IRIS -U USER < /home/irisowner/dev/docker/iris/load-code.script" |
          tee test-results/load-code.log
          if grep -q "ERROR #" test-results/load-code.log; then exit 1; fi

      - name: RUN %UnitTest
        run: |
          docker compose exec -T iris she -c "iris session IRIS -U USER < /home/irisowner/dev/docker/iris/run-tests.script" |
          tee test-results/iris-unittest.log
          grep -q "UNITTEST-RESULT: PASS" test-results/iris-unittest.log

      - name: Collect container log
        if: always()
        run: docker compose logs --no-color iris > test/results/iris-container.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-test-evidence
          path: test-results/
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - name: Install pinned dev dependencies
        working-directory: python
        run: python -m pip install -r requirements-dev.txt
      - name: pytest
        working-directory: python
        run: python -m pytest

  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node:test
        working-directory: tools/node
        run: npm test
      - name: Fixtures are up to date (drift check)
        working-directory: tools/node
        run: |
          npm run generate --silent
          git diff --exit-code -- ../../fixtures/generated/patients.json
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB-TOKEN: ${{ secrets.GITHUB_TOKEN }}
